<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Spring Boot Bridge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 260px;
            padding: 12px;
            margin: 0;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #ddd;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: #0b57d0;
            border-bottom-color: #0b57d0;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        select, input {
            width: 100%;
            box-sizing: border-box;
            padding: 7px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button.action-btn {
            width: 100%;
            padding: 8px 12px;
            cursor: pointer;
            background-color: #0b57d0;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .status-text {
            margin-top: 10px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="tabs">
    <button class="tab-btn active" data-tab="healthTab">Health</button>
    <button class="tab-btn" data-tab="settingsTab">Settings</button>
</div>

<!-- Health Tab -->
<div id="healthTab" class="tab-panel active">
    <button id="checkBtn" class="action-btn">Check Health</button>
    <div id="status" class="status-text">Waiting...</div>
    <input type="text" id="testPrompt" placeholder="Return JSON with key ok: true" />
    <button id="runAiBtn" class="action-btn">Test AI Endpoint</button>
    <pre id="aiResult" style="white-space: pre-wrap; font-size: 11px; margin-top: 8px;"></pre>
</div>

<!-- Settings Tab -->
<div id="settingsTab" class="tab-panel">
    <label for="aiProvider">Provider</label>

    <select id="aiProvider">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="groq">Groq</option>
    </select>


    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="Enter your API key" />

    <button id="saveSettingsBtn" class="action-btn">Save Settings</button>
    <div id="settingsStatus" class="status-text"></div>
</div>
<div id="scamSection" style="margin-top: 12px;">
    <button id="analyzeJobBtn" class="action-btn">Analyze This Job</button>
    <button id="forceAnalyzeBtn" class="action-btn" style="margin-top: 6px; background: #444;">
        Re-analyze (Bypass Cache)
    </button>
    <div id="scamStatus" class="status-text"></div>
    <div id="scamResult" style="margin-top: 8px; font-size: 12px;"></div>
</div>
<div id="matchSection" style="margin-top: 12px; border-top: 1px solid #333; padding-top: 10px;">
    <button id="matchResumeBtn" class="action-btn">Match Resume to Job</button>
    <button id="forceMatchBtn" class="action-btn" style="margin-top: 6px; background: #444;">
        Re-match (Bypass Cache)
    </button>
    <div id="matchStatus" class="status-text"></div>
    <div id="matchResult" style="margin-top: 8px; font-size: 12px;"></div>
</div>
<div id="autofillSection" style="margin-top: 12px; border-top: 1px solid #333; padding-top: 10px;">
    <button id="autofillBtn" class="action-btn">Autofill</button>
    <div id="autofillStatus" class="status-text"></div>
</div>
<div id="resumeSection">
    <input type="file" id="resumeFileInput" accept="application/pdf,.pdf" />
    <button id="uploadResumeBtn" class="action-btn">Upload My Resume</button>
    <button id="loadResumeBtn" class="action-btn" style="margin-top: 6px; background: #444;">
        Refresh Saved Profile
    </button>
    <div id="resumeStatus" class="status-text"></div>
    <pre id="resumePreview" style="white-space: pre-wrap; font-size: 11px; max-height: 220px; overflow: auto;"></pre>
</div>

<script src="popup.js"></script>
</body>
</html>
